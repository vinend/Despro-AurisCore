[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "auriscore"
version = "0.1.0"
description = "Research heart-sound screening pipeline"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[project.optional-dependencies]
cnn = ["tensorflow==2.21.0", "psutil==7.0.0"]
notebook = ["tensorflow==2.21.0", "jupyterlab>=4,<5", "ipykernel>=6,<7", "nbformat>=5,<6", "nbconvert>=7,<8"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
