name: Deploy AurisCore to Vercel

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/deploy-vercel.yml'
      - 'WebApp/**'
      - 'AI-Pipeline/src/**'
      - 'AI-Pipeline/scripts/_bootstrap.py'
      - 'AI-Pipeline/scripts/analyze_recording.py'
      - 'AI-Pipeline/results/EXP-L030-frame-temporal-delta/**'
      - 'AI-Pipeline/results/EXP-A105-abdomen-crnn-specaugment-noise/**'
      - 'hosting/requirements.txt'
      - 'hosting/vercel/inference/**'
      - 'scripts/prepare_vercel_inference.py'
  workflow_dispatch:
    inputs:
      target:
        description: Vercel project to deploy
        type: choice
        required: true
        default: both
        options: [both, website, inference]

permissions:
  contents: read

concurrency:
  group: auriscore-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      # Project and team IDs are public identifiers. Authentication is separate.
      VERCEL_ORG_ID: team_A1OilaTOwEzutdlWDjv1DXF5
      VERCEL_CLI_VERSION: '65.15.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Check deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Add VERCEL_TOKEN to the GitHub production environment secrets."
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: inputs.target != 'website'
        with:
          python-version: '3.12'

      - name: Stage inference with frozen model assets
        if: inputs.target != 'website'
        run: |
          python -m pip install --no-deps 'librosa==0.11.0'
          python scripts/prepare_vercel_inference.py --output "$RUNNER_TEMP/auriscore-inference"

      - name: Stage tracked website source
        if: inputs.target != 'inference'
        run: |
          mkdir -p "$RUNNER_TEMP/auriscore-web"
          git archive HEAD:WebApp | tar -xf - -C "$RUNNER_TEMP/auriscore-web"

      # Ship the parser before inference can start emitting new response fields.
      - name: Deploy website and ESP32 gateway
        if: inputs.target != 'inference'
        env:
          VERCEL_PROJECT_ID: prj_CwJAkPRlFSo6uxircot3ryjMgdT0
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ runner.temp }}/auriscore-web
        run: |
          vercel deploy --prod --yes --non-interactive
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            --output /dev/null https://auriscore-cloud.vercel.app/

      - name: Deploy inference
        if: inputs.target != 'website'
        env:
          VERCEL_PROJECT_ID: prj_MiS9oCSlSTUwK95SKHtXFa03k6k7
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ runner.temp }}/auriscore-inference
        run: |
          vercel deploy --prod --yes --non-interactive
          status="$(curl --silent --show-error --retry 3 --max-time 20 \
            --request POST --output /dev/null --write-out '%{http_code}' \
            https://auriscore-inference.vercel.app/v1/analysis/lung/pcm)"
          if [[ "$status" != 401 ]]; then
            echo "::error::Expected inference authentication to return HTTP 401, got $status."
            exit 1
          fi
