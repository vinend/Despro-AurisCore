name: auriscore-engineering
services:
  web:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
      target: web
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - type: bind
        source: ${AURISCORE_MODELS_DIR:?Set private model bundle directory}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
  gateway:
    build:
      context: ..
      dockerfile: hosting/Dockerfile
      target: gateway
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      AURISCORE_DEVICE_TOKEN: ${AURISCORE_DEVICE_TOKEN:?Set a NEW private server pairing token}
      AURISCORE_ALLOWED_ORIGINS: https://${AURISCORE_DOMAIN:?Set server domain}
    expose: ["8082"]
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      AURISCORE_DOMAIN: ${AURISCORE_DOMAIN:?Set server domain}
      AURISCORE_WEB_USER: ${AURISCORE_WEB_USER:?Set web username}
      AURISCORE_WEB_PASSWORD_HASH: ${AURISCORE_WEB_PASSWORD_HASH:?Set bcrypt password hash}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_started
volumes:
  caddy_data:
  caddy_config:
